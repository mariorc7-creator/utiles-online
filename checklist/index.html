<script src="../app.js"></script>
<script src="../qa-fixes.js"></script>
<script src="../papelesia.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  setTimeout(function () {
    if (typeof cargarProgresoGuardado === "function") cargarProgresoGuardado();
    const params = new URLSearchParams(window.location.search);
    const comunidad = params.get("comunidad");
    if (comunidad && typeof datosComunidadesPapelesBebe !== "undefined" && datosComunidadesPapelesBebe[comunidad]) {
      respuestas.comunidad = comunidad;
      guardarProgreso();
    }
    if (typeof continuarProgreso === "function" && typeof hayProgresoGuardado === "function" && hayProgresoGuardado()) {
      continuarProgreso();
    } else if (typeof empezarOriginalPapelesBebe === "function") {
      empezarOriginalPapelesBebe();
    } else if (typeof empezar === "function") {
      empezar();
    }
  }, 0);
});
</script>
<script src="../config.js"></script>
<script src="/analytics.js"></script>
</body>
</html>
