<head>

</head>
<body>
<header>
  <div class="header-contenido">
    <a href="/" class="logo logo-enlace">Papeles del <span>Bebé</span></a>
    <div class="header-acciones">
      <nav class="nav-principal" aria-label="Navegación principal">
        <a href="/checklist/">Mis ayudas y trámites</a>
        <a href="/herramientas/">Herramientas</a>
        <a href="/premium/" class="nav-premium">Premium</a>
      </nav>
      <a href="/" class="boton-inicio enlace-inicio">← Inicio</a>
    </div>
  </div>
</header>
<main class="premium-shell">
  <div id="premiumPlan" aria-live="polite"></div>
<p class="revision revision-sitio" style="font-size:.88rem;color:#657184;margin:24px 0 12px">Última revisión: <time datetime="2026-10-19">19 de octubre de 2026</time></p></main>
<footer>
  <div class="footer-contenido">
    <div class="logo">Papeles del <span>Bebé</span></div>
    <p>Menos papeleo. Más tiempo para tu bebé.</p>
    <p class="footer-aviso">Plan orientativo. Verifica requisitos y plazos definitivos en la administración competente.</p>
  </div>
</footer>
<script>
(function(){
  var MASTER='papelesbebe_que_me_falta_v1';
  var PREMIUM='papelesbebe_premium_progress_v2';
  var map={registro:'registro',ss:'seguridad-social',salud:'tarjeta-sanitaria',padron:'padron',prestacion:'prestacion',maternidad:'deduccion',ccaa:'ayudas',mono:'ayudas',multiple:'ayudas',discapacidad:'ayudas'};
  try{
    var master=JSON.parse(localStorage.getItem(MASTER)||'{}')||{};
    if(Object.keys(master).length){
      var premium=JSON.parse(localStorage.getItem(PREMIUM)||'{}')||{};
      premium.tasks=premium.tasks||{};
      premium.docs=premium.docs||{};
      Object.keys(map).forEach(function(task){
        var key=map[task];
        if(typeof master[key]==='boolean') premium.tasks[task]=master[key]?'done':'pending';
      });
      localStorage.setItem(PREMIUM,JSON.stringify(premium));
    }
  }catch(e){}
})();
</script>
<script src="../premium-plan.js?v=20261015-5"></script>
<script src="../../papelesia.js?v=20261013-1"></script>
<script src="/analytics.js"></script>
</body>
</html>
