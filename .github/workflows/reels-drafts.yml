name: Papeles Bebé - Reels (borradores)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generar-reels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          python -m pip install Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Crear tres vídeos de muestra
        run: python scripts/reels/generate_reels.py
      - name: Guardar MP4 descargables para revisión
        uses: actions/upload-artifact@v4
        with:
          name: papeles-del-bebe-reels
          path: reels-output/*.mp4
          retention-days: 14
