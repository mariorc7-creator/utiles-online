name: Papeles Bebé - Reels (borradores)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tipo de prueba'
        required: true
        type: choice
        options: [illustrated, ai, sample]
        default: illustrated
permissions:
  contents: read
jobs:
  generar-reels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          python -m pip install Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Crear guiones y voces originales con IA
        if: inputs.mode == 'ai'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/reels/generate_ai.mjs
      - name: Generar ilustraciones, guion y voz con IA
        if: inputs.mode == 'illustrated'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/reels/generate_illustrated_reel.mjs
      - name: Montar Reel ilustrado con movimiento y audio
        if: inputs.mode == 'illustrated'
        run: python scripts/reels/render_illustrated_reel.py guarderia
      - name: Montar vídeos clásicos
        if: inputs.mode != 'illustrated'
        run: python scripts/reels/generate_reels.py
      - name: Guardar MP4 descargables para revisión
        uses: actions/upload-artifact@v4
        with:
          name: papeles-del-bebe-reels
          path: |
            reels-output/*.mp4
            reels-input/*.json
          if-no-files-found: error
          retention-days: 14
