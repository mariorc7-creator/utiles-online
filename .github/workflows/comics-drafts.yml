name: Papeles Bebé - Comics IA (Instagram y X)
on:
  workflow_dispatch:
    inputs:
      comic:
        description: "Tema del comic"
        type: choice
        required: true
        options: [guarderia, tramites, primerizos]
        default: guarderia
  schedule:
    # Lunes, miercoles y viernes a las 10:00 UTC: programa en Buffer Instagram y X.
    - cron: '0 10 * * 1,3,5'
permissions:
  contents: write
concurrency:
  group: papeles-bebe-comics-publishing
  cancel-in-progress: false
jobs:
  crear-comic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      COMIC_INDEX: ${{ github.event.inputs.comic == 'guarderia' && '0' || github.event.inputs.comic == 'tramites' && '1' || github.event.inputs.comic == 'primerizos' && '2' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evitar segundas publicaciones el mismo dia
        id: guard
        shell: bash
        run: |
          DATE=$(TZ=Europe/Madrid date +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ -d "public/comics/$DATE" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            COMIC=$(find "public/comics/$DATE" -name '*-01.jpg' -printf '%f\n' | head -1)
            COMIC="${COMIC%-01.jpg}"
            test -n "$COMIC"
            echo "comic=$COMIC" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            mkdir -p comics-input
            if [ -f "public/comics/$DATE/$COMIC.json" ]; then
              cp "public/comics/$DATE/$COMIC.json" "comics-input/$COMIC.json"
            else
              printf '%s\n' '{"caption":"La crianza está llena de sorpresas. ¿Te ha pasado algo parecido? 😂","panels":[]}' > "comics-input/$COMIC.json"
            fi
            echo "Ya existe el cómic del $DATE: se reutiliza para reintentar Buffer sin generar imágenes nuevas."
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar Pillow
        if: steps.guard.outputs.skip != 'true'
        run: python -m pip install Pillow
      - name: Generar guion y cuatro ilustraciones
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/comics/generate_comic.mjs
      - name: Montar carrusel y copy
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          COMIC=$(find comics-input -name '*.json' -printf '%f\n' | head -1)
          COMIC="${COMIC%.json}"
          test -n "$COMIC"
          python scripts/comics/render_comic.py "$COMIC"
      - name: Guardar borradores descargables (sin publicar)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: papeles-del-bebe-comic
          path: |
            comics-output/*.jpg
            comics-output/*.txt
            comics-input/*.json
          retention-days: 14
          if-no-files-found: error
      - name: Publish stable images to public GitHub URLs
        if: steps.guard.outputs.skip != 'true'
        id: hosting
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(TZ=Europe/Madrid date +%Y-%m-%d)
          COMIC=$(find comics-input -name '*.json' -printf '%f\n' | head -1)
          COMIC="${COMIC%.json}"
          DEST="public/comics/$DATE"
          mkdir -p "$DEST"
          cp comics-output/"$COMIC"-0[1-4].jpg "$DEST"/
          cp "comics-output/$COMIC-preview.jpg" "$DEST"/
          cp "comics-input/$COMIC.json" "$DEST"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "content: comic $DATE $COMIC"
            git push origin HEAD:main
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "comic=$COMIC" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check public URLs are reachable
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/mariorc7-creator/utiles-online/${{ steps.hosting.outputs.sha }}/public/comics/${{ steps.hosting.outputs.date }}/${{ steps.hosting.outputs.comic }}-01.jpg"
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --head "$URL" >/dev/null; then exit 0; fi
            sleep 10
          done
          echo "Media URL unavailable"; exit 1
      - name: Schedule comic in Buffer Instagram and X
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          COMIC_PUBLIC_DIR: ${{ steps.hosting.outputs.date || steps.guard.outputs.date }}
          COMIC_ASSET_SHA: ${{ steps.hosting.outputs.sha || steps.guard.outputs.sha }}
          COMIC_ID: ${{ steps.hosting.outputs.comic || steps.guard.outputs.comic }}
        run: node scripts/comics/publish_comic.mjs
