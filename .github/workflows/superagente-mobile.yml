name: SuperAgente - Mobile QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'scripts/superagente_mobile.mjs'
      - 'scripts/superagente_visual_regression.mjs'
      - 'scripts/superagente_editorial_preview.py'
      - 'scripts/superagente_preview_sandbox.py'
      - 'scripts/superagente_cataluna_package.py'
      - 'scripts/superagente_cataluna_mobile_stage.py'
      - 'scripts/test_superagente_cataluna_mobile_stage.py'
      - 'superagente/proposals/**'
      - 'superagente/package.json'
      - '.github/workflows/superagente-mobile.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --prefix superagente --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix superagente playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/superagente-http.log 2>&1 & echo $! > /tmp/superagente-http.pid
      - name: Run mobile smoke tests
        run: node scripts/superagente_mobile.mjs
      - name: Preserve baseline mobile screenshots
        run: |
          mv superagente/mobile-artifacts superagente/mobile-artifacts-baseline
          mv superagente/mobile-results.json superagente/mobile-results-baseline.json
      - name: Build isolated editorial preview
        run: |
          python -m unittest discover -s scripts -p 'test_superagente_preview_sandbox.py' -v
          python scripts/superagente_preview_sandbox.py --sandbox-root "$RUNNER_TEMP/superagente-preview-site"
      - name: Include both Catalonia clarifications in disposable preview
        run: |
          python -m unittest discover -s scripts -p 'test_superagente_cataluna_mobile_stage.py' -v
          python scripts/superagente_cataluna_mobile_stage.py --sandbox-root "$RUNNER_TEMP/superagente-preview-site"
      - name: Start temporary preview server
        run: python3 -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/superagente-preview-site" > /tmp/superagente-preview-http.log 2>&1 &
      - name: Run mobile checks on proposed changes
        env:
          TEST_BASE_URL: http://127.0.0.1:8766
        run: node scripts/superagente_mobile.mjs
      - name: Compare responsive layout before and after edits
        run: node scripts/superagente_visual_regression.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superagente-mobile
          path: |
            superagente/mobile-artifacts/
            superagente/mobile-artifacts-baseline/
            superagente/mobile-results.json
            superagente/mobile-results-baseline.json
            superagente/visual-regression-results.json
          retention-days: 14
